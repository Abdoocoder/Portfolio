name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      - name: Install dependencies
        run: npm install

      - name: Remove server-only routes for static export
        run: |
          rm -f src/middleware.ts
          rm -rf src/app/api src/app/dashboard
          node -e "
          const fs = require('fs');
          // Layout: strip ClerkProvider
          let l = fs.readFileSync('src/app/layout.tsx','utf8');
          l = l.replace(/import.*Clerk.*\n/,'');
          l = l.replace(/<ClerkProvider>/g,'').replace(/<\/ClerkProvider>/g,'');
          fs.writeFileSync('src/app/layout.tsx',l);
          // Header: strip Clerk import + Show blocks (desktop + mobile)
          let h = fs.readFileSync('src/app/_components/header.tsx','utf8');
          h = h.replace(/import.*clerk.*\n/i,'');
          // Desktop Clerk div: remove from its opening to the language-buttons div
          h = h.replace(/ {10}<div className=\"hidden sm:flex items-center gap-1\\.5\">\n[\s\S]*?\n {10}<div className=\"hidden sm:flex items-center gap-2\">/,
            '\n          <div className=\"hidden sm:flex items-center gap-2\">');
          // Mobile Clerk div: remove from its opening to parent's closing div
          h = h.replace(/ {20}<div className=\"flex items-center gap-2 pt-2 border-t border-border\">\n[\s\S]*?\n {20}<\/div>/,'');
          fs.writeFileSync('src/app/_components/header.tsx',h);
          "

      - name: Build with Next.js
        run: npx next build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          NEXT_PUBLIC_FORMSPREE_URL: ${{ secrets.NEXT_PUBLIC_FORMSPREE_URL }}
          # Vault vars — not needed for GitHub Pages but avoids build errors if
          # the route ever gains a GET handler in the future.
          NEXT_PUBLIC_GIST_ID: ${{ secrets.NEXT_PUBLIC_GIST_ID }}
          NEXT_PUBLIC_GITHUB_ACTIONS: "true"

          GITHUB_ACTIONS: "true"



      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
